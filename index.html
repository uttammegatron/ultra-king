function closeNet(){clearTimeout(jt);clearInterval(jr);jt=jr=null;try{$('#retryJ').classList.add('hide')}catch(e){}
const c=cl;if(c){pub({type:'BYE',id:myId});cl=null;try{c.end()}catch(e){}}
players=[];role='local';joined=false;hostSid=null}
function onMsg(b){let m;try{m=JSON.parse(b.toString())}catch(e){return}
if(!m||m.sid===myId)return;
if(m.type==='CHAT'){if(pidMap[m.color]===m.id&&typeof m.text==='string')showChat(+m.color,m.text.slice(0,24));return}
if(role==='host')hostMsg(m);
else if(role==='guest'){
if(hostSid?m.sid!==hostSid:(m.type!=='LOBBY'&&m.type!=='FULL'))return;
if(m.q!==undefined){if(m.q<=lastQ)return;lastQ=m.q}
if(m.type==='BYE'){if(state==='SETUP'){setSt('Host closed the room');$('#retryJ').classList.remove('hide')}else{$('#msg').textContent='Host disconnected';state='LOST'}return}
guestMsg(m)}}
function lobby(){const names=players.map(p=>p.name);nPlayers=Math.max(2,names.length);$('#plC').innerHTML=names.map((n,i)=>`<div>${i?'':'&#9819; '}${esc(n)}</div>`).join('');$('#goC').disabled=names.length<2;bc({type:'LOBBY',players:players.map(p=>({id:p.pid,name:p.name}))})}
function hostMsg(m){const ex=players.find(x=>x.pid===m.id);
if(m.type==='JOIN'){if(ex){if(ex.color!==undefined)delete bots[ex.color];state==='SETUP'?lobby():sync();return}
if(players.length>=6||state!=='SETUP'){pub({type:'FULL',to:m.id});return}
players.push({name:String(m.name||'Player').slice(0,10),pid:m.id});lobby();return}
if(m.type==='BYE'){drop(m.id);return}
if(m.type==='LEAVE'){leave(m.id);return}
const p=ex;if(!p||p.color===undefined)return;const c=p.color;
if(m.type==='REQ_ROLL'){if(state==='WAIT_ROLL'&&active[turn]===c)doRoll();else sync()}
else if(m.type==='REQ_MOVE'){if(state==='WAIT_MOVE'&&active[turn]===c&&valid.includes(m.i))play(c,m.i,roll);else sync()}}
function drop(id){const i=players.findIndex(p=>p.pid===id);if(i<1)return;const p=players[i];
if(state==='SETUP'){players.splice(i,1);lobby()}else{if(gone[p.color])return;bots[p.color]=true;msg(p.name+' left, bot takes over');if(active[turn]===p.color){tOn=false;if(state==='WAIT_ROLL')doRoll();else if(state==='WAIT_MOVE')play(p.color,aiPick(p.color,roll,valid),roll)}}}
function hostRoom(){closeNet();if(typeof mqtt==='undefined'){setSt('Online play needs the MQTT script, which is blocked here');return}
role='host';seq=0;const ch='23456789ABCDEFGHJKMNPQRSTUVWXYZ';roomCode='UK'+[0,1,2].map(()=>ch[rnd()*ch.length|0]).join('');
$('#code').textContent='-----';setSt('Creating room...');
jt=setTimeout(()=>setSt('Connection timed out — check network'),10000);
netOpen('ultraking/room/'+roomCode.trim().toUpperCase(),()=>{clearTimeout(jt);if(!players.length){$('#code').textContent=roomCode;players=[{name:$('#nameC').value.trim()||'Host',pid:myId}];lobby()}setSt('Room Ready — Share Code')})}
$('#nameC').oninput=()=>{if(players[0]){players[0].name=$('#nameC').value.trim()||'Host';lobby()}};
$('#goC').onclick=()=>{if(players.length<2)return;unlock();nPlayers=players.length;role='host';cpu=false;bots={};
const act=colorsFor(nPlayers);pnames={};pidMap={};players.forEach((p,k)=>{p.color=act[k];pnames[act[k]]=p.name;pidMap[act[k]]=p.pid});myColor=act[0];
const ys={};players.forEach(p=>ys[p.pid]=p.color);bc({type:'START',n:nPlayers,pn:pnames,ys,pids:pidMap});
begin();$('#mic').classList.remove('hide');voiceInit();startTurn()};
function joinRoom(){closeNet();if(typeof mqtt==='undefined'){setSt('Online play needs the MQTT script, which is blocked here');return}
const code=$('#codeJ').value.trim().toUpperCase(),name=$('#nameJ').value.trim()||'Guest';if(code.length<5){setSt('Enter the 5-character room code');return}
role='guest';const rb=$('#retryJ');rb.onclick=joinRoom;setSt('Connecting...');lastQ=0;joined=false;hostSid=null;
const fail=t=>{closeNet();setSt(t);rb.classList.remove('hide')};
jt=setTimeout(()=>fail('Connection timed out — check code or switch network'),10000);
netOpen('ultraking/room/'+code,()=>{const send=()=>pub({type:'JOIN',id:myId,name});send();
if(joined||jr)return;clearTimeout(jt);jt=setTimeout(()=>fail('Room not found or Host closed'),8000);jr=setInterval(send,1500)})}
$('#goJ').onclick=()=>{unlock();joinRoom()};
const activeLeft=()=>active.filter(c=>!rank.includes(c)&&!gone[c]).length;
function toast(t){let e=$('#tt');if(!e){e=document.createElement('div');e.id='tt';e.style.cssText='position:fixed;left:50%;top:calc(54px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:8;padding:8px 18px;border-radius:99px;background:rgba(220,38,38,.92);font:800 15px system-ui;white-space:nowrap;pointer-events:none;transition:opacity .3s';document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1800)}
function forfeit(){const c=active[turn];tOn=false;setPulse(c,[]);valid=[];consecutiveSixes=0;
if(!gone[c]){const t="Time's Up! Turn Skipped";toast(t);bc({type:'TOAST',t})}nextTurn()}
function leave(id){const p=players.find(x=>x.pid===id);if(!p)return;if(state==='SETUP')return drop(id);
if(p.color===undefined||gone[p.color]||state==='GAME_OVER')return;
const c=p.color;gone[c]=true;msg(p.name+' left');bc({type:'TOAST',t:p.name+' left'});toast(p.name+' left');
if(activeLeft()<=1)return endGame();
if(active[turn]===c&&(state==='WAIT_ROLL'||state==='WAIT_MOVE')){tOn=false;setPulse(c,[]);valid=[];nextTurn()}else sync()}
$('#exitb').onclick=()=>{$('#chatD').classList.add('hide');$('#leaveM').classList.remove('hide')};
$('#leaveN').onclick=()=>$('#leaveM').classList.add('hide');
$('#leaveY').onclick=()=>{$('#leaveM').classList.add('hide');tOn=false;
if(role!=='local')pub({type:'LEAVE',id:myId});
try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}
Object.values(calls).forEach(k=>{try{k.close()}catch(e){}});try{vp&&vp.destroy()}catch(e){}vp=null;
Object.values(audEls).forEach(a=>{try{a.srcObject=null;a.remove()}catch(e){}});
closeNet();setTimeout(()=>location.reload(),300)};
const QC=['Hi!','Good Luck!','Hurry up!','Nice move!','Oops!','Wait!','Haha!','Well Played!'];
$('#chatP').innerHTML=QC.map(t=>`<button>${esc(t)}</button>`).join('');
function showChat(c,text){const p=mode&&pods[armOf[c]];if(!p)return;const e=document.createElement('div'),sx=cx+p.x*g,sy=cy+p.y*g,top=p.y<0;
e.className='bub';e.textContent=text;e.style.borderColor=COL[c];e.style.left=Math.max(70,Math.min(W-70,sx))+'px';
e.style.top=(top?sy+p.h*g/2+6:sy-p.h*g/2-6)+'px';e.style.transform=top?'translate(-50%,0)':'translate(-50%,-100%)';
document.body.appendChild(e);sfx('pop');setTimeout(()=>e.style.opacity=0,2500);setTimeout(()=>e.remove(),3000)}
function sendChat(t){t=String(t).trim().slice(0,24);if(!t||!active.length)return;
const c=role==='local'?(isCPU(active[turn])?active[0]:active[turn]):myColor;
if(role!=='local')pub({type:'CHAT',id:myId,color:c,text:t});
showChat(c,t);$('#chatD').classList.add('hide');$('#chatI').value=''}
$('#chatb').onclick=()=>$('#chatD').classList.toggle('hide');
document.querySelectorAll('#chatP button').forEach(b=>b.onclick=()=>sendChat(b.textContent));
$('#chatS').onclick=()=>sendChat($('#chatI').value);
$('#chatI').onkeydown=e=>{if(e.key==='Enter')sendChat($('#chatI').value)};
const mq=[];let mb=false;
async function pump(){if(mb)return;mb=true;while(mq.length){const m=mq.shift();try{await handle(m)}catch(e){}}mb=false}
async function mirror(c,i,ns){await moveTok(c,i,ns);if(onOuter(ns)&&safe(gTile(c,ns)))sfx('safe');const vs=victims(c,ns);if(vs.length){sfx('cap');await Promise.all(vs.map(([o,j])=>sendHome(o,j)))}if(ns===FINISH)sfx('home');layout()}
async function handle(m){
if(m.type==='MSG')$('#msg').textContent=m.t;
else if(m.type==='ROLL'){state='ROLLING';tOn=false;await rollDice(m.c,m.v)}
else if(m.type==='MOVE'){state='ANIMATING';tOn=false;setPulse(m.c,[]);await mirror(m.c,m.i,m.ns)}
else if(m.type==='STATE'){const nr=m.rank.slice(rank.length);nr.forEach((c,k)=>{if(!(m.state==='GAME_OVER'&&k===nr.length-1&&m.rank.length===active.length)){sfx('fin');celebrate(c)}});
gone={};(m.gone||[]).forEach(c=>gone[c]=true);tok=m.tok;rank=m.rank;turn=m.turn;valid=m.valid;roll=m.roll;Object.assign(pv,m.pv);state=m.state;tOn=m.tOn;tEnd=Date.now()+m.left*1000;layout();
active.forEach(c=>setPulse(c,state==='WAIT_MOVE'&&c===myColor&&active[turn]===c?valid:[]));
if(state==='GAME_OVER')endUI()}}
function guestMsg(m){
if(m.type==='LOBBY'){if(!m.players.some(p=>p.id===myId))return;if(!joined){joined=true;hostSid=m.sid;clearTimeout(jt);clearInterval(jr);setSt('Joined! Waiting for Host...')}$('#plJ').innerHTML=m.players.map(p=>`<div>${esc(p.name)}</div>`).join('')}
else if(m.type==='FULL'){if(m.to===myId){setSt('Room is full or already started');closeNet()}}
else if(m.type==='START'){const y=m.ys&&m.ys[myId];if(y===undefined)return;pnames=m.pn;myColor=y;pidMap=m.pids;nPlayers=m.n;cpu=false;role='guest';begin();$('#mic').classList.remove('hide');voiceInit()}
else if(m.type==='TOAST')toast(m.t)
else{mq.push(m);pump()}}
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{uiMode=b.dataset.t;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('s',x===b));
$('#pL').classList.toggle('hide',uiMode!=='local');$('#pC').classList.toggle('hide',uiMode!=='create');$('#pJ').classList.toggle('hide',uiMode!=='join');setSt('');
if(uiMode==='create')hostRoom();else closeNet()});
function watch(s,col){try{audio();const an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(s).connect(an);ana[col]={an,buf:new Uint8Array(256)}}catch(e){}}
const colOf=id=>+Object.keys(pidMap).find(k=>pidMap[k]===id);
function attach(id,s){let a=audEls[id];if(!a){a=document.createElement('audio');a.autoplay=true;a.playsInline=true;document.body.appendChild(a);audEls[id]=a}a.srcObject=s;try{a.play().catch(()=>{})}catch(e){}watch(s,colOf(id))}
const vtoast=t=>{let e=$('#vt');if(!e){e=document.createElement('div');e.id='vt';e.style.cssText='position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font:600 12px system-ui;pointer-events:none';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)};
function voiceInit(){if(vp||typeof Peer==='undefined')return;try{vp=new Peer('ukv-'+myId,ICE);vp.on('call',onCall);vp.on('error',e=>{if(e.type!=='peer-unavailable')vtoast('Voice unavailable on this network')})}catch(e){vtoast('Voice unavailable on this network')}}
function onCall(call){try{call.answer(stream||undefined);call.on('stream',s=>attach(call.peer.slice(4),s));call.on('error',()=>vtoast('Voice unavailable on this network'))}catch(e){}}
function callAll(){voiceInit();setTimeout(()=>{if(!vp||!vp.open)vtoast('Voice unavailable on this network')},8000);Object.values(pidMap).forEach(id=>{if(!vp||id===myId||calls[id])return;try{const cl2=vp.call('ukv-'+id,stream);if(!cl2)return;calls[id]=cl2;cl2.on('stream',s=>attach(id,s));cl2.on('close',()=>delete calls[id]);cl2.on('error',()=>delete calls[id])}catch(e){vtoast('Voice unavailable on this network')}})}
$('#mic').onclick=async()=>{const b=$('#mic');
if(!stream){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});watch(stream,myColor);callAll()}catch(e){b.textContent='Mic blocked';b.disabled=true;return}}
micOn=!micOn;stream.getAudioTracks().forEach(t=>t.enabled=micOn);b.textContent=micOn?'Mic On':'Mic Off';b.classList.toggle('on',micOn)};
resize();requestAnimationFrame(frame);
</script>
